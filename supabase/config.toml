# Configuración local de Supabase CLI (supabase start). En el proyecto remoto
# los mismos valores se aplican desde Dashboard › Authentication.
project_id = "nexus-platform"

[api]
enabled = true
port = 54321
# `private` NO se expone: contiene las funciones auxiliares de RLS.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "50GiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://nexus.example/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Alta solo por invitación o SSO corporativo.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.web_authn]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

# SSO SAML 2.0 (Entra ID, Okta, Google Workspace) se habilita en el proyecto
# remoto (plan Pro o superior) y cada IdP se registra con:
#   supabase sso add --type saml --metadata-url <url> --domains <dominio>
# El trigger private.handle_new_user() une al usuario a la organización
# cuyo sso_domain coincide con el dominio de su correo.

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

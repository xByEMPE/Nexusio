# Configuración local de Supabase CLI (supabase start). En el proyecto remoto
# los mismos valores se aplican desde Dashboard › Authentication.
project_id = "nexus-platform"

[api]
enabled = true
port = 54321
# `private` NO se expone: contiene las funciones auxiliares de RLS.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[storage]
enabled = true
file_size_limit = "50GiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Alta solo por invitación.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
sign_in_sign_ups = 30
token_verifications = 30

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.web_authn]
enroll_enabled = true
verify_enabled = true

[auth.email]
# En el CLI, enable_signup=false aquí deshabilita el proveedor email (y el login); el alta pública sigue cerrada por [auth] enable_signup=false.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.invite]
subject = "Invitación a NEXUS"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña de NEXUS"
content_path = "./supabase/templates/recovery.html"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest-demo"
version = "0.1.0"
description = "Demostración del contrato de subida NEXUS (exiftool -> GSD -> WebP -> TUS -> ingest_manifest)"
requires-python = ">=3.11"
dependencies = ["pillow", "tuspy", "supabase", "jsonschema"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["ingest_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
